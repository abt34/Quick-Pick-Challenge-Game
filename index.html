<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Pick Challenge Game</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <section class="first-section">
      <div class="head">
        <div class="reset"><button class="reset-btn">RESET</button></div>
        <div class="time-counter timeleft">TIME</div>
      </div>
      <div class="heading-text message">Start Playing</div>

      <div class="container">
        <div class="img image1">
          <img src="img/img1.jpg" class="image01" alt="" />
          <div class="guess-number guess1"></div>
        </div>

        <div class="img image2">
          <img src="img/img2.jpg" class="image02" alt="" />
          <div class="guess-number guess2"></div>
        </div>

        <div class="img image3">
          <img src="img/img3.jpg" class="image03" alt="" />
          <div class="guess-number guess3"></div>
        </div>
      </div>


      <div class="input-number">
        <input class="input input1" type="text" placeholder=""/>
        <input class="input input2" type="text" placeholder="" />
        <input class="input input3" type="text" placeholder="" />
      </div>
      <div class="cin"> 
        <button class="btn submit  reset-btn">submit</button>
      </div>

      <div class="play">
        <button class="btn play-btn">PLAY</button>
      </div>

      <div class="score">
        <p class="score-name">SCORE</p>
        <p class="score-value"> </p>
      </div>
    </section>
    <script src="./js/index.js"></script>
  </body>
</html>
